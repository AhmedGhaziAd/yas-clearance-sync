name: ChatGPT Ads + Microsoft product feeds

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}      # "Run workflow" button

permissions:
  contents: write            # needed to publish the feed branch

concurrency:
  group: chatgpt-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build feeds from Shopify
        run: node .github/workflows/feed.mjs
        env:
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      - name: Publish feed.tsv + microsoft.tsv to the "feed" branch
        working-directory: out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b feed
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add feed.tsv microsoft.tsv
          git commit -q -m "Feed $(date -u +%F' '%H:%M) UTC"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" feed
          echo "OpenAI feed URL:    https://raw.githubusercontent.com/${{ github.repository }}/feed/feed.tsv"
          echo "Microsoft feed URL: https://raw.githubusercontent.com/${{ github.repository }}/feed/microsoft.tsv"
